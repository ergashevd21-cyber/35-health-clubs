<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сравнение опросов · 35 Health Clubs</title>
<style>
:root{--navy:#14213d;--blue:#fca311;--line:#e5e7eb;--muted:#667085;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 Arial,sans-serif;color:#172033}.wrap{max-width:1100px;margin:32px auto;padding:0 18px}.head,.panel,.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}.head{background:var(--navy);color:#fff}.head p{color:#d8dfed}h1,h2,h3{margin-top:0}select,button{font:inherit;padding:11px 12px;border-radius:9px;border:1px solid #ccd2dc;background:white;max-width:100%;width:100%}button{background:var(--blue);border:0;font-weight:700;cursor:pointer;margin-top:12px}.pickers,.metrics,.comparegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.metric strong{display:block;font-size:26px;color:var(--navy)}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}.better{color:#16803d}.worse{color:#b42318}.same{color:#667085}.status{margin-top:10px}.bar{height:8px;background:#edf0f4;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:var(--blue)}@media(max-width:760px){.pickers,.metrics,.comparegrid{grid-template-columns:1fr}.wrap{margin:14px auto}td,th{padding:7px;font-size:13px}}
</style></head><body><main class="wrap">
<header class="head"><h1>Сравнение опросов</h1><p>Выберите два опроса. Система сравнит число ответов, eNPS и общие вопросы, чтобы показать изменения.</p><a href="survey-admin.html" style="color:#fff">← К опросам</a></header>
<section class="panel"><div class="pickers"><label>Первый опрос<select id="survey1"><option value="">Загрузка…</option></select></label><label>Второй опрос<select id="survey2"><option value="">Выберите опрос</option></select></label></div><button id="compare">Сравнить результаты</button><p id="status" class="status muted" role="status"></p></section>
<section id="results" hidden>
<div class="metrics" id="metrics"></div><section class="panel"><h2>Изменение по вопросам</h2><p class="muted">Среднее рассчитывается только для числовых ответов 0–10. Вопросы сопоставляются по тексту.</p><div id="questionTable"></div></section>
<section class="panel"><h2>Вывод для HR</h2><div id="summary"></div></section></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
"use strict";
const SUPABASE_URL="https://mvpfqnkpojhakugohctn.supabase.co",SUPABASE_ANON_KEY="sb_publishable_xFzUoeSo-oNXfB4NCn8m-w_2PQV0k9Y";
const API=SUPABASE_URL+"/functions/v1/hr-survey-admin", $=id=>document.getElementById(id);
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(action,payload={},method="GET"){let {data:{session}}=await client.auth.getSession();if(!session?.access_token){const x=await client.auth.refreshSession();session=x.data?.session}if(!session?.access_token)throw Error("Войдите через общую страницу авторизации.");const url=method==="GET"?API+"?"+new URLSearchParams({action,...payload}):API;const r=await fetch(url,{method,headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"},...(method==="POST"?{body:JSON.stringify({action,...payload})}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||"Ошибка загрузки");return d}
let surveys=[];
async function init(){try{const d=await api("surveys");surveys=d.surveys||[];const options=surveys.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.title)+' · '+esc(s.status)+'</option>').join("");$("survey1").innerHTML='<option value="">Выберите опрос</option>'+options;$("survey2").innerHTML='<option value="">Выберите опрос</option>'+options;const q=new URLSearchParams(location.search);if(q.get("survey1"))$("survey1").value=q.get("survey1");if(q.get("survey2"))$("survey2").value=q.get("survey2");$("status").textContent="Выберите два опроса и нажмите «Сравнить результаты»."}catch(e){$("status").textContent=e.message}}
function metrics(data){const qs=data.questions||[],rs=data.responses||[];let scores=[];for(const r of rs){const a=r.answers||{};for(const q of qs){const key=q.key||"q_"+q.id;const v=Number(a[key]??a[q.question_key]??a[q.id]);if(Number.isFinite(v)&&v>=0&&v<=10&&String(a[key]??a[q.question_key]??a[q.id]).trim()!=="")scores.push({q:q.question_text||q.question_key,v})}}const recommend=qs.find(q=>/рекоменд|recommend/i.test(q.question_text||""));let promoters=0,critics=0,n=0;if(recommend){for(const r of rs){const a=r.answers||{},v=Number(a[recommend.key||"q_"+recommend.id]??a[recommend.question_key]??a[recommend.id]);if(Number.isFinite(v)&&v>=0&&v<=10){n++;if(v>=9)promoters++;if(v<=6)critics++}}}const byQuestion={};for(const s of scores){byQuestion[s.q]??=[];byQuestion[s.q].push(s.v)}return {count:rs.length,enps:n?Math.round((promoters/n-critics/n)*100):null,byQuestion:Object.fromEntries(Object.entries(byQuestion).map(([k,v])=>[k,v.reduce((a,b)=>a+b,0)/v.length]))}}
async function compare(){const id1=$("survey1").value,id2=$("survey2").value;if(!id1||!id2){$("status").textContent="Выберите оба опроса.";return}if(id1===id2){$("status").textContent="Выберите два разных опроса.";return}$("compare").disabled=true;$("status").textContent="Загружаем и сравниваем ответы…";try{const [a,b]=await Promise.all([api("responses",{survey_id:id1}),api("responses",{survey_id:id2})]);const ma=metrics(a),mb=metrics(b);$("results").hidden=false;const delta=mb.count-ma.count;const enpsDelta=ma.enps===null||mb.enps===null?null:mb.enps-ma.enps;$("metrics").innerHTML=[["Ответы — опрос 1",ma.count,""],["Ответы — опрос 2",mb.count,(delta>0?"+":"")+delta],["eNPS — опрос 1",ma.enps===null?"Нет данных":ma.enps, ""],["eNPS — изменение",enpsDelta===null?"Нет данных":(enpsDelta>0?"+":"")+enpsDelta,enpsDelta===null?"":enpsDelta>0?"лучше":enpsDelta<0?"хуже":"без изменений"]].map(x=>'<article class="metric"><span class="muted">'+esc(x[0])+'</span><strong>'+esc(x[1])+'</strong><span class="muted">'+esc(x[2])+'</span></article>').join("");const names=new Set([...Object.keys(ma.byQuestion),...Object.keys(mb.byQuestion)]);const rows=[...names].map(name=>{const x=ma.byQuestion[name],y=mb.byQuestion[name],d=x===undefined||y===undefined?null:y-x;return {name,x,y,d}});$("questionTable").innerHTML=rows.length?'<table><thead><tr><th>Вопрос</th><th>Опрос 1</th><th>Опрос 2</th><th>Изменение</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+ (r.x===undefined?"—":r.x.toFixed(2))+'</td><td>'+(r.y===undefined?"—":r.y.toFixed(2))+'</td><td class="'+(r.d===null?"same":r.d>0?"better":r.d<0?"worse":"same")+'">'+(r.d===null?"Нельзя сравнить":(r.d>0?"+":"")+r.d.toFixed(2))+'</td></tr>').join("")+'</tbody></table>':'<p class="muted">Нет общих числовых вопросов 0–10 для сравнения.</p>';const good=rows.filter(r=>r.d!==null&&r.d>0.2),bad=rows.filter(r=>r.d!==null&&r.d< -0.2);$("summary").innerHTML='<p><b>'+esc(surveys.find(s=>s.id===id1)?.title||"Опрос 1")+'</b>: '+ma.count+' ответов. <b>'+esc(surveys.find(s=>s.id===id2)?.title||"Опрос 2")+'</b>: '+mb.count+' ответов.</p><p>'+(enpsDelta===null?"eNPS нельзя сравнить: в одном из опросов нет числового вопроса о рекомендации.":"Изменение eNPS: "+(enpsDelta>0?"+":"")+enpsDelta+" пунктов.")+'</p><p>Улучшение среднего балла: '+(good.length?good.map(x=>esc(x.name)).join("; "):"не выявлено")+'.</p><p>Снижение среднего балла: '+(bad.length?bad.map(x=>esc(x.name)).join("; "):"не выявлено")+'.</p><p class="muted">Это статистический сигнал. Проверьте число ответов, состав участников и формулировки вопросов перед управленческими решениями.</p>';$("status").textContent="Сравнение готово."}catch(e){$("status").textContent="Ошибка: "+e.message}finally{$("compare").disabled=false}}
$("compare").addEventListener("click",compare);init();
</script></body></html>

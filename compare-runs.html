<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сравнение потоков · 35 Health Clubs</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182235;font:15px/1.5 Arial,sans-serif}.wrap{max-width:1000px;margin:28px auto;padding:0 16px}.hero,.panel,.metric{background:#fff;border:1px solid #e0e5ed;border-radius:14px;padding:20px;margin-bottom:14px}.hero{background:#14213d;color:#fff}.hero p{color:#dce4f1}.pickers,.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}label{display:block;font-weight:700}select,button{width:100%;margin-top:8px;padding:11px;border:1px solid #cbd3df;border-radius:8px;font:inherit;background:white}button{background:#fca311;border:0;font-weight:bold;cursor:pointer}h1,h2{margin-top:0}.metric strong{display:block;font-size:27px;color:#14213d}.muted{color:#667085}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e3e7ee;text-align:left}.up{color:#087443}.down{color:#b42318}@media(max-width:650px){.pickers,.metrics{grid-template-columns:1fr}td,th{padding:7px;font-size:13px}}
</style></head><body><main class="wrap"><header class="hero"><h1>Сравнение потоков опроса</h1><p>Сравнивайте завершённый поток с новым. Ответы потоков не смешиваются.</p><a href="survey-admin.html" style="color:white">← К опросам</a></header><section class="panel"><div class="pickers"><label>Опрос<select id="survey"><option>Загрузка…</option></select></label><label>Первый поток<select id="run1"></select></label><label>Второй поток<select id="run2"></select></label></div><button id="go">Сравнить потоки</button><p id="status" class="muted" role="status"></p></section><section id="out" hidden><div id="metrics" class="metrics"></div><section class="panel"><h2>Изменение оценок</h2><div id="table"></div></section><section class="panel"><h2>Краткий вывод для HR</h2><div id="summary"></div></section></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
"use strict";
const URL_BASE="https://mvpfqnkpojhakugohctn.supabase.co",KEY="sb_publishable_xFzUoeSo-oNXfB4NCn8m-w_2PQV0k9Y",API=URL_BASE+"/functions/v1/hr-survey-admin",client=window.supabase.createClient(URL_BASE,KEY),$=x=>document.getElementById(x);let surveys=[],runs=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(action,payload={}){let {data:{session}}=await client.auth.getSession();if(!session?.access_token)session=(await client.auth.refreshSession()).data?.session;if(!session?.access_token)throw Error("Войдите в сайт и откройте сравнение снова.");const u=API+"?"+new URLSearchParams({action,...payload});const r=await fetch(u,{headers:{apikey:KEY,Authorization:"Bearer "+session.access_token}});const d=await r.json();if(!r.ok)throw Error(d.error||"Ошибка запроса");return d}
async function init(){try{const d=await api("surveys");surveys=d.surveys||[];$("survey").innerHTML=surveys.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.title)+'</option>').join("");await loadRuns()}catch(e){$("status").textContent=e.message}}
async function loadRuns(){const id=$("survey").value;if(!id)return;try{const d=await api("runs",{survey_id:id});runs=d.runs||[];const opts=runs.map(r=>'<option value="'+esc(r.id)+'">#'+esc(r.run_number)+' · '+esc(r.title)+' · '+esc(r.status)+' · ответов '+esc(r.response_count)+'</option>').join("");$("run1").innerHTML=opts;$("run2").innerHTML=opts;if(runs.length>1)$("run2").selectedIndex=0; if(runs.length>1)$("run1").selectedIndex=1;$("status").textContent=runs.length<2?"Нужно не менее двух потоков для сравнения.":"Выберите два потока."}catch(e){$("status").textContent=e.message}}
function stats(d){const qs=d.questions||[],rs=d.responses||[],by={},scores=[];for(const q of qs){const key=q.answer_key||q.key||("q_"+q.id);const vals=[];for(const r of rs){const a=r.answers||{};let raw=a[key]??a[q.question_key]??a[q.id];if(raw!==null&&raw!==undefined&&String(raw).trim()!==""){const v=Number(raw);if(Number.isFinite(v)&&v>=0&&v<=10)vals.push(v)}}if(vals.length){by[q.question_text||q.question_key||key]=vals.reduce((a,b)=>a+b,0)/vals.length;scores.push(...vals)}}return {count:rs.length,by,overall:scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:null}}
async function compare(){const survey=$("survey").value,r1=$("run1").value,r2=$("run2").value;if(!survey||!r1||!r2){$("status").textContent="Выберите два потока.";return}if(r1===r2){$("status").textContent="Выберите разные потоки.";return}$("go").disabled=true;$("status").textContent="Сравниваем ответы…";try{const [a,b]=await Promise.all([api("responses",{survey_id:survey,run_id:r1}),api("responses",{survey_id:survey,run_id:r2})]);const x=stats(a),y=stats(b),delta=x.overall===null||y.overall===null?null:y.overall-x.overall;$("out").hidden=false;$("metrics").innerHTML=[["Ответы · поток 1",x.count,""],["Ответы · поток 2",y.count,""],["Изменение средней оценки",delta===null?"Нет данных":(delta>0?"+":"")+delta.toFixed(2),delta===null?"":delta>0?"Рост":delta<0?"Снижение":"Без изменений"]].map(m=>'<article class="metric"><span class="muted">'+esc(m[0])+'</span><strong>'+esc(m[1])+'</strong><span class="muted">'+esc(m[2])+'</span></article>').join("");const names=new Set([...Object.keys(x.by),...Object.keys(y.by)]);const rows=[...names].map(n=>({n,a:x.by[n],b:y.by[n],d:x.by[n]===undefined||y.by[n]===undefined?null:y.by[n]-x.by[n]}));$("table").innerHTML=rows.length?'<table><thead><tr><th>Вопрос</th><th>Поток 1</th><th>Поток 2</th><th>Изменение</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.n)+'</td><td>'+(r.a===undefined?"—":r.a.toFixed(2))+'</td><td>'+(r.b===undefined?"—":r.b.toFixed(2))+'</td><td class="'+(r.d===null?"":r.d>0?"up":r.d<0?"down":"")+'">'+(r.d===null?"Нет общих данных":(r.d>0?"+":"")+r.d.toFixed(2))+'</td></tr>').join("")+'</tbody></table>':'<p>Нет общих числовых вопросов 0–10.</p>';$("summary").innerHTML='<p>Поток «'+esc(runs.find(r=>r.id===r1)?.title)+'»: '+x.count+' ответов. Поток «'+esc(runs.find(r=>r.id===r2)?.title)+'»: '+y.count+' ответов.</p><p>'+(delta===null?"Не удалось рассчитать общую среднюю оценку.":"Средняя оценка изменилась на "+(delta>0?"+":"")+delta.toFixed(2)+" балла.")+'</p><p class="muted">Сравнивайте также число ответов и состав участников. Общая средняя оценка не заменяет eNPS. Для eNPS требуется отдельный расчёт вопроса о рекомендации.</p>';$("status").textContent="Сравнение готово."}catch(e){$("status").textContent="Ошибка сравнения: "+e.message}finally{$("go").disabled=false}}
$("survey").addEventListener("change",loadRuns);$("go").addEventListener("click",compare);init();
</script></body></html>

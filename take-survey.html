</head><body><main class="wrap"><header class="survey-brand"><img class="brand-logo" src="https://static.tildacdn.one/tild3565-3438-4530-b765-303466353035/35HC_badge.png" alt="35 Health Clubs"><span class="muted">ОПРОС СОТРУДНИКОВ</span></header><h1 id="title">Загрузка опроса…</h1><p id="description" class="muted"></p><form id="form"><section class="card"><b>О вашей рабочей роли</b><p class="muted">Эти данные нужны для анализа ответов по группам.</p><label>Отдел<select name="department" required><option value="">Выберите отдел</option><option>Call Center</option><option>Продажи</option><option>Тренерский отдел</option><option>Администрация клубов</option><option>HR</option><option>Маркетинг</option><option>Финансы</option><option>Операционный отдел</option><option>IT</option><option>Другое</option></select></label><p><label>Должность<select name="position" required><option value="">Выберите должность</option><option>Оператор Call Center</option><option>Hunter</option><option>Pusher</option><option>Closer</option><option>Team Lead</option><option>Тренер</option><option>Администратор клуба</option><option>Рекрутер</option><option>HR-менеджер</option><option>Промоутер</option><option>Руководитель отдела</option><option>Другое</option></select></label></p><label>Стаж<select name="tenure" required><option value="">Выберите стаж</option><option>Менее 1 месяца</option><option>1–3 месяца</option><option>3–6 месяцев</option><option>6–12 месяцев</option><option>Более 1 года</option></select></label></section><div id="questions"></div><section class="card"><button class="submit" id="send">Отправить ответы →</button><p id="status" class="status" role="status"></p></section></form><section id="done" class="card hidden"><h2>Спасибо за ответы!</h2><p>Ваши ответы сохранены.</p></section></main><script>
const URL="https://mvpfqnkpojhakugohctn.supabase.co",KEY="sb_publishable_xFzUoeSo-oNXfB4NCn8m-w_2PQV0k9Y",id=new URLSearchParams(location.search).get("survey");
const $=x=>document.getElementById(x),form=$("form");let survey=null,questions=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function get(path){const r=await fetch(URL+"/rest/v1/"+path,{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});if(!r.ok)throw Error("Не удалось загрузить опрос. Возможно, ссылка недействительна или опрос закрыт.");return r.json()}
function render(){ $("title").textContent=survey.title;$("description").textContent=survey.description||"Пожалуйста, ответьте на вопросы ниже.";if(!questions.length){$("questions").innerHTML='<section class="card">В этом опросе пока нет вопросов. Сообщите HR.</section>';return}
$("questions").innerHTML=questions.map((q,i)=>{const name="q_"+q.id,required=q.is_required!==false;let input="";
if(q.question_type==="text")input='<textarea name="'+name+'" '+(required?"required":"")+' maxlength="1500" placeholder="Ваш ответ…"></textarea>';
else {const vals=q.question_type==="yesno"?["Да","Нет"]:q.question_type==="scale"?Array.from({length:11},(_,n)=>String(n)):(Array.isArray(q.options)?q.options:[]);input='<div class="opts">'+vals.map(v=>'<label><input type="radio" name="'+name+'" value="'+esc(v)+'" '+(required?"required":"")+'>'+esc(v)+'</label>').join("")+'</div>'}
return '<section class="card"><p class="q">'+(i+1)+". "+esc(q.question_text)+(required?"":" (необязательно)")+'</p>'+input+'</section>'}).join("")}
async function init(){try{if(!id)throw Error("В ссылке отсутствует номер опроса.");const found=await get("surveys?select=id,title,description,status,starts_at,ends_at,audience_type,target_departments,target_positions,is_anonymous&id=eq."+encodeURIComponent(id));survey=found[0];if(!survey||survey.status!=="active")throw Error("Опрос не найден или ещё не опубликован.");const now=Date.now();if(survey.starts_at&&new Date(survey.starts_at)>now)throw Error("Опрос ещё не начался.");if(survey.ends_at&&new Date(survey.ends_at)<now)throw Error("Срок прохождения опроса завершён.");const links=await get("survey_question_items?select=question_id,sort_order,question:survey_custom_questions(id,question_text,question_type,options,is_required,is_active)&survey_id=eq."+encodeURIComponent(id)+"&order=sort_order.asc");questions=links.filter(x=>x.question&&x.question.is_active).map(x=>x.question);render()}catch(e){$("title").textContent="Опрос недоступен";$("description").textContent=e.message;form.classList.add("hidden")}}
form.addEventListener("submit",async e=>{e.preventDefault();$("status").className="status";$("status").textContent="Сохраняем ответы…";$("send").disabled=true;const data=new FormData(form),answers={};for(const [k,v] of data.entries()){if(k==="department"||k==="position"||k==="tenure")answers[k]=v;else if(String(v).trim())answers[k]=v}
try{const r=await fetch(URL+"/rest/v1/survey_responses",{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:"Bearer "+KEY,Prefer:"return=minimal"},body:JSON.stringify({answers,survey_id:survey.id,survey_version:"custom-"+survey.id,submitted_at:new Date().toISOString()})});if(!r.ok){let detail="";try{const body=await r.json();detail=body.code||body.message||body.details||"";console.error("Survey submission failed",{status:r.status,code:body.code,details:body.details,message:body.message});}catch(e){}throw Error("Не удалось сохранить ответы. Код: "+(detail||("HTTP "+r.status))+". Сообщите HR.");}form.classList.add("hidden");$("done").classList.remove("hidden")}catch(err){$("status").textContent=err.message;$("status").className="status error";$("send").disabled=false}});
init();
</script></body></html>

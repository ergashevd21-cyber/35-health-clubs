<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Опрос · 35 Health Clubs</title><style>
:root{--ink:#18332c;--bg:#f3f5f0;--line:#e1e7df;--lime:#d8f36a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 16px 60px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;margin:14px 0}.muted{color:#718078;font-size:13px}h1{font-size:clamp(30px,6vw,44px);line-height:1.1}.q{margin:0 0 14px;font-weight:700}.opts{display:flex;gap:8px;flex-wrap:wrap}.opts label{flex:1;min-width:85px;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;cursor:pointer}.opts input{margin-right:5px}textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit}.submit{border:0;background:var(--lime);border-radius:9px;padding:14px 18px;font-weight:800;cursor:pointer}.status{font-size:13px}.error{color:#a33b32}.hidden{display:none!important}</style></head><body><main class="wrap"><div class="muted">35 HEALTH CLUBS · ОПРОС СОТРУДНИКОВ</div><h1 id="title">Загрузка опроса…</h1><p id="description" class="muted"></p><form id="form"><section class="card"><b>О вашей рабочей роли</b><p class="muted">Эти данные нужны для анализа ответов по группам.</p><label>Отдел<select name="department" required><option value="">Выберите отдел</option><option>Call Center</option><option>Продажи</option><option>Тренерский отдел</option><option>Администрация клубов</option><option>HR</option><option>Маркетинг</option><option>Финансы</option><option>Операционный отдел</option><option>IT</option><option>Другое</option></select></label><p><label>Должность<select name="position" required><option value="">Выберите должность</option><option>Оператор Call Center</option><option>Hunter</option><option>Pusher</option><option>Closer</option><option>Team Lead</option><option>Тренер</option><option>Администратор клуба</option><option>Рекрутер</option><option>HR-менеджер</option><option>Промоутер</option><option>Руководитель отдела</option><option>Другое</option></select></label></p><label>Стаж<select name="tenure" required><option value="">Выберите стаж</option><option>Менее 1 месяца</option><option>1–3 месяца</option><option>3–6 месяцев</option><option>6–12 месяцев</option><option>Более 1 года</option></select></label></section><div id="questions"></div><section class="card"><button class="submit" id="send">Отправить ответы →</button><p id="status" class="status" role="status"></p></section></form><section id="done" class="card hidden"><h2>Спасибо за ответы!</h2><p>Ваши ответы сохранены.</p></section></main><script>
const URL="https://mvpfqnkpojhakugohctn.supabase.co",KEY="sb_publishable_xFzUoeSo-oNXfB4NCn8m-w_2PQV0k9Y",id=new URLSearchParams(location.search).get("survey");
const $=x=>document.getElementById(x),form=$("form");let survey=null,questions=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function get(path){const r=await fetch(URL+"/rest/v1/"+path,{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});if(!r.ok)throw Error("Не удалось загрузить опрос. Возможно, ссылка недействительна или опрос закрыт.");return r.json()}
function render(){ $("title").textContent=survey.title;$("description").textContent=survey.description||"Пожалуйста, ответьте на вопросы ниже.";if(!questions.length){$("questions").innerHTML='<section class="card">В этом опросе пока нет вопросов. Сообщите HR.</section>';return}
$("questions").innerHTML=questions.map((q,i)=>{const name="q_"+q.id,required=q.is_required!==false;let input="";
if(q.question_type==="text")input='<textarea name="'+name+'" '+(required?"required":"")+' maxlength="1500" placeholder="Ваш ответ…"></textarea>';
else {const vals=q.question_type==="yesno"?["Да","Нет"]:q.question_type==="scale"?Array.from({length:11},(_,n)=>String(n)):(Array.isArray(q.options)?q.options:[]);input='<div class="opts">'+vals.map(v=>'<label><input type="radio" name="'+name+'" value="'+esc(v)+'" '+(required?"required":"")+'>'+esc(v)+'</label>').join("")+'</div>'}
return '<section class="card"><p class="q">'+(i+1)+". "+esc(q.question_text)+(required?"":" (необязательно)")+'</p>'+input+'</section>'}).join("")}
async function init(){try{if(!id)throw Error("В ссылке отсутствует номер опроса.");const found=await get("surveys?select=id,title,description,status,starts_at,ends_at,audience_type,target_departments,target_positions,is_anonymous&id=eq."+encodeURIComponent(id));survey=found[0];if(!survey||survey.status!=="active")throw Error("Опрос не найден или ещё не опубликован.");const now=Date.now();if(survey.starts_at&&new Date(survey.starts_at)>now)throw Error("Опрос ещё не начался.");if(survey.ends_at&&new Date(survey.ends_at)<now)throw Error("Срок прохождения опроса завершён.");const links=await get("survey_question_items?select=question_id,sort_order,question:survey_custom_questions(id,question_text,question_type,options,is_required,is_active)&survey_id=eq."+encodeURIComponent(id)+"&order=sort_order.asc");questions=links.filter(x=>x.question&&x.question.is_active).map(x=>x.question);render()}catch(e){$("title").textContent="Опрос недоступен";$("description").textContent=e.message;form.classList.add("hidden")}}
form.addEventListener("submit",async e=>{e.preventDefault();$("status").className="status";$("status").textContent="Сохраняем ответы…";$("send").disabled=true;const data=new FormData(form),answers={};for(const [k,v] of data.entries()){if(k==="department"||k==="position"||k==="tenure")answers[k]=v;else if(String(v).trim())answers[k]=v}
try{const r=await fetch(URL+"/rest/v1/survey_responses",{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:"Bearer "+KEY,Prefer:"return=minimal"},body:JSON.stringify({answers,survey_id:survey.id,survey_version:"custom-"+survey.id,submitted_at:new Date().toISOString()})});if(!r.ok)throw Error("Не удалось сохранить ответы. Сообщите HR.");form.classList.add("hidden");$("done").classList.remove("hidden")}catch(err){$("status").textContent=err.message;$("status").className="status error";$("send").disabled=false}});
init();
</script></body></html>
